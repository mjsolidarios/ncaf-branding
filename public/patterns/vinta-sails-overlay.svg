<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Vinta Sails overlay — transparent background for use on coloured surfaces">
  <defs>
    <!-- Diagonal directional bands at 25° (matches 155° visual angle) -->
    <pattern id="vs" width="110" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect x="0"   width="18" height="110" fill="white" fill-opacity="0.20"/>
      <rect x="18"  width="8"  height="110" fill="white" fill-opacity="0.05"/>
      <rect x="26"  width="18" height="110" fill="white" fill-opacity="0.15"/>
      <rect x="44"  width="18" height="110" fill="white" fill-opacity="0.17"/>
      <rect x="62"  width="8"  height="110" fill="white" fill-opacity="0.04"/>
      <rect x="70"  width="18" height="110" fill="white" fill-opacity="0.10"/>
      <rect x="88"  width="22" height="110" fill="white" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="url(#vs)"/>
</svg>
