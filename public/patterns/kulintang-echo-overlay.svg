<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Kulintang Echo overlay — transparent background for use on coloured surfaces">
  <defs>
    <!-- Three concentric rings per cell, mimicking percussion resonance -->
    <pattern id="ke" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="48" cy="48" r="9"  fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.28"/>
      <circle cx="48" cy="48" r="22" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.16"/>
      <circle cx="48" cy="48" r="36" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.10"/>
      <!-- Corner peek rings for seamless tiling -->
      <circle cx="0"  cy="0"  r="9"  fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.28"/>
      <circle cx="96" cy="0"  r="9"  fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.28"/>
      <circle cx="0"  cy="96" r="9"  fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.28"/>
      <circle cx="96" cy="96" r="9"  fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="url(#ke)"/>
</svg>
